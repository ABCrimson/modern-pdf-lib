name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Every master commit keeps its own run, because release.yml publishes a tag only after
# ci.yml succeeded on that commit. A pull request cancels its superseded runs.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Must equal `channel` in rust-toolchain.toml (the dated nightly every Rust gate
  # resolves to); bump both together. A dated toolchain input needs
  # a commit of the dtolnay/rust-toolchain master branch (see .peak-modern-holds.json).
  RUST_TOOLCHAIN: nightly-2026-11-11
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Lint & Type-check
  # ---------------------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # pnpm comes from `packageManager`; the action installs the runtime and runs
      # one frozen `pnpm install` (store cached on the lockfile hash).
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: TypeScript type-check (root, cli and scripts projects)
        run: pnpm run typecheck

      - name: Lint (oxlint + tsgolint, type-aware)
        run: pnpm run lint

  # ---------------------------------------------------------------------------
  # Build WASM modules
  # ---------------------------------------------------------------------------
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      # wasm-pack is a pinned devDependency (node_modules/.bin), so the install
      # below also provides the build tool; there is no curl installer.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Cache WASM output
        uses: actions/cache@v6.1.0
        id: wasm-cache
        with:
          path: src/wasm/*/pkg
          key: wasm-pkg-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('src/wasm/*/src/**/*.rs', 'src/wasm/*/Cargo.toml', 'src/wasm/*/Cargo.lock', 'scripts/build-wasm.sh', 'rust-toolchain.toml') }}

      # Each crate is its own Cargo root until the workspace migration, so each
      # gets its own cache entry.
      - name: Cache Cargo registry & build artifacts
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src/wasm/libdeflate -> target
            src/wasm/png -> target
            src/wasm/ttf -> target
            src/wasm/shaping -> target
            src/wasm/jbig2 -> target
            src/wasm/jpeg -> target

      # build-wasm.sh downloads the binaryen release named by its BINARYEN_VERSION
      # into .cache/binaryen and verifies its SHA-256; the cache key reads that
      # variable so the two cannot drift.
      - name: Read binaryen version
        id: binaryen
        run: echo "version=$(sed -n 's/^BINARYEN_VERSION=//p' scripts/build-wasm.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache binaryen
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6.1.0
        with:
          path: .cache/binaryen
          key: binaryen-${{ runner.os }}-${{ steps.binaryen.outputs.version }}

      - name: Build WASM crates
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: pnpm run build:wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wasm-modules
          path: src/wasm/*/pkg
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Build TypeScript
  # ---------------------------------------------------------------------------
  build-ts:
    name: Build TypeScript
    needs: build-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: wasm-modules
          path: src/wasm

      # tsdown + IIFE bundle + ESM/CJS smoke of every built entry.
      - name: Build (tsdown, IIFE, smoke)
        run: pnpm run build

      - name: Copy WASM binaries into dist/wasm
        run: pnpm run copy:wasm

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Pack check: the tarball contents users would install (six wasm + IIFE,
  # publint, are-the-types-wrong)
  # ---------------------------------------------------------------------------
  pack:
    name: Pack Check
    needs: build-ts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Download dist
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Pack and inspect the tarball
        run: pnpm run check:pack

  # ---------------------------------------------------------------------------
  # Unit tests
  # ---------------------------------------------------------------------------
  test-unit:
    name: Unit Tests (${{ matrix.name }})
    needs: build-ts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Experimental legs report but never fail the workflow.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Gating: the Node line the package targets (engines >=26.4).
          - name: node 26
            id: node-26
            runtime: node@26
            experimental: false
          # Probe: the older line, to see how far below the engines floor the suite holds.
          - name: node 24
            id: node-24
            runtime: node@24
            experimental: true
          # Probe: the runtime pinned in package.json devEngines.runtime. An empty
          # `runtime` makes pnpm/setup install every devEngines.runtime entry.
          - name: devEngines runtime
            id: node-dev
            runtime: ''
            experimental: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: ${{ matrix.runtime }}
          cache: true
          require-lockfile: true

      - name: Download dist
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: wasm-modules
          path: src/wasm

      # Memory policy (pool, workers, heap) lives in vitest.config.ts; no NODE_OPTIONS here.
      - name: Run unit tests
        run: pnpm exec vitest run --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-${{ matrix.id }}
          path: coverage
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Integration tests
  # ---------------------------------------------------------------------------
  test-integration:
    name: Integration Tests
    needs: build-ts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Download dist
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: wasm-modules
          path: src/wasm

      - name: Run integration tests
        run: pnpm exec vitest run tests/integration

  # ---------------------------------------------------------------------------
  # E2E tests (Playwright)
  # ---------------------------------------------------------------------------
  test-e2e:
    name: E2E Tests
    needs: build-ts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Download dist
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: wasm-modules
          path: src/wasm

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Benchmarks
  # ---------------------------------------------------------------------------
  benchmark:
    name: Benchmarks
    needs: build-ts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: always()
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Download dist
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: wasm-modules
          path: src/wasm

      - name: Run benchmarks (standalone tinybench harness, tests/benchmarks/run.ts)
        run: pnpm run bench

  # ---------------------------------------------------------------------------
  # Bundle size check
  # ---------------------------------------------------------------------------
  # Measures dist/index.mjs only (the core ESM entry), not the full tarball; the
  # README badge figures are reconciled in the docs phase (P4).
  bundle-size:
    name: Bundle Size
    needs: build-ts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download dist
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Measure bundle size
        run: |
          echo "## Bundle Size Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Measure raw size
          RAW_SIZE=$(wc -c < dist/index.mjs)
          echo "Raw ESM bundle: ${RAW_SIZE} bytes" >> "$GITHUB_STEP_SUMMARY"

          # Measure gzipped size
          GZIP_SIZE=$(gzip -c dist/index.mjs | wc -c)
          echo "Gzipped ESM bundle: ${GZIP_SIZE} bytes" >> "$GITHUB_STEP_SUMMARY"

          # Budget check: 50 KB gzipped max for core bundle
          BUDGET=51200
          if [ "$GZIP_SIZE" -gt "$BUDGET" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**OVER BUDGET**: ${GZIP_SIZE} bytes > ${BUDGET} bytes (50 KB)" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Bundle size ${GZIP_SIZE} bytes exceeds budget of ${BUDGET} bytes (50 KB gzipped)"
            exit 1
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Within budget (${GZIP_SIZE} / ${BUDGET} bytes)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Rust checks (per crate)
  # ---------------------------------------------------------------------------
  # Known red until P3 makes the Rust tier gating: continue-on-error keeps it from
  # failing the workflow while it still reports clippy and test results per crate.
  rust-checks:
    name: Rust (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        crate: [libdeflate, png, ttf, shaping, jbig2, jpeg]
    defaults:
      run:
        working-directory: src/wasm/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src/wasm/${{ matrix.crate }} -> target

      - name: Clippy (wasm32-unknown-unknown)
        run: cargo clippy --target wasm32-unknown-unknown

      - name: Native tests
        run: cargo test
