name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Every master commit keeps its own run, because release.yml publishes a tag only after
# ci.yml succeeded on that commit. A pull request cancels its superseded runs.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Must equal `channel` in rust-toolchain.toml (the dated nightly every Rust gate
  # resolves to); bump both together. A dated toolchain input needs
  # a commit of the dtolnay/rust-toolchain master branch (see .peak-modern-holds.json).
  RUST_TOOLCHAIN: nightly-2026-11-15
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Lint & Type-check
  # ---------------------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # pnpm comes from `packageManager`; the action installs the runtime and runs
      # one frozen `pnpm install` (store cached on the lockfile hash).
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: TypeScript type-check (root, cli, scripts, tests and security-tests projects)
        run: pnpm run typecheck

      - name: Lint (oxlint + tsgolint, type-aware)
        run: pnpm run lint

      # Both checks load vitest.config.ts through the installed vitest/node API, so they run
      # after the install. The first fails when a tests/**/*.test.ts file belongs to no Vitest
      # project or to more than one; the second is the census of the known-defect markers.
      - name: Every test file in exactly one Vitest project
        run: pnpm run check:test-projects

      - name: Known-defect marker census
        run: pnpm run check:known-defects

      # Both read tracked sources only and need no build: the first checks the internal-folder
      # rule of the src layout against the exports of the package entries, the second that every
      # repository path a tracked document, config or script names resolves.
      - name: Layout gate
        run: pnpm run gate:layout

      - name: Paths named in documents and comments
        run: pnpm run check:docs

  # ---------------------------------------------------------------------------
  # Build WASM modules
  # ---------------------------------------------------------------------------
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      # wasm-pack is a pinned devDependency (node_modules/.bin), so the install
      # below also provides the build tool; there is no curl installer.
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      # The key hashes package.json, which pins wasm-pack, so a wasm-pack
      # version change misses the cache and rebuilds the crates.
      - name: Cache WASM output
        uses: actions/cache@v6.1.0
        id: wasm-cache
        with:
          path: crates/*/pkg
          key: wasm-pkg-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('crates/*/src/**/*.rs', 'crates/*/Cargo.toml', 'crates/*/Cargo.lock', 'scripts/build/build-wasm.sh', 'rust-toolchain.toml', 'package.json') }}

      # Each crate is its own Cargo root until the workspace migration, so each
      # gets its own cache entry.
      - name: Cache Cargo registry & build artifacts
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            crates/libdeflate -> target
            crates/png -> target
            crates/ttf -> target
            crates/shaping -> target
            crates/jbig2 -> target
            crates/jpeg -> target

      # build-wasm.sh downloads the binaryen release named by its BINARYEN_VERSION
      # into .cache/binaryen and verifies its SHA-256; the cache key reads that
      # variable so the two cannot drift.
      - name: Read binaryen version
        id: binaryen
        run: echo "version=$(sed -n 's/^BINARYEN_VERSION=//p' scripts/build/build-wasm.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache binaryen
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6.1.0
        with:
          path: .cache/binaryen
          key: binaryen-${{ runner.os }}-${{ steps.binaryen.outputs.version }}

      - name: Build WASM crates
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: pnpm run build:wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wasm-modules
          path: crates/*/pkg
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Build TypeScript
  # ---------------------------------------------------------------------------
  build-ts:
    name: Build TypeScript
    needs: build-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: wasm-modules
          path: crates

      # tsdown + IIFE bundle + ESM/CJS smoke of every built entry.
      - name: Build (tsdown, IIFE, smoke)
        run: pnpm run build

      - name: Copy WASM binaries into dist/wasm
        run: pnpm run copy:wasm

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Pack check: the tarball contents users would install (six wasm + IIFE,
  # publint, are-the-types-wrong)
  # ---------------------------------------------------------------------------
  pack:
    name: Pack Check
    needs: build-ts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Download dist
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Pack and inspect the tarball
        run: pnpm run check:pack

  # ---------------------------------------------------------------------------
  # Unit and integration tests (Vitest projects unit and integration)
  # ---------------------------------------------------------------------------
  test-unit:
    name: Tests (unit, integration; ${{ matrix.name }})
    needs: build-ts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # An experimental leg reports but never fails the workflow. The suite is not run below the
    # engines floor (Node 24 fails by design), so there is no leg for it.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Gating: the Node line the package targets (engines >=26.4).
          - name: node 26
            id: node-26
            runtime: node@26
            experimental: false
          # Probe: the runtime pinned in package.json devEngines.runtime. An empty
          # `runtime` makes pnpm/setup install every devEngines.runtime entry.
          - name: devEngines runtime
            id: node-dev
            runtime: ''
            experimental: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: ${{ matrix.runtime }}
          cache: true
          require-lockfile: true

      - name: Download dist
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: wasm-modules
          path: crates

      # Unit tests of the encrypted load path compare with qpdf, so this job installs the same
      # checksum-pinned qpdf as job test-oracle (QPDF_VERSION and QPDF_SHA256 move together in
      # both jobs). The AppImage is extracted, so no FUSE is needed.
      - name: Install qpdf
        env:
          GH_TOKEN: ${{ github.token }}
          QPDF_VERSION: 12.4.2
          QPDF_SHA256: 907b5e86f289c92b382a02869eb9c5709b2e5ef6fb2f6a7ae56514915d06d5dd
        run: |
          mkdir -p "$RUNNER_TEMP/qpdf" && cd "$RUNNER_TEMP/qpdf"
          appimage="qpdf-$QPDF_VERSION-x86_64.AppImage"
          gh release download "v$QPDF_VERSION" -R qpdf/qpdf -p "$appimage"
          echo "$QPDF_SHA256  $appimage" | sha256sum -c -
          chmod +x "$appimage"
          "./$appimage" --appimage-extract > /dev/null
          echo "QPDF=$RUNNER_TEMP/qpdf/squashfs-root/AppRun" >> "$GITHUB_ENV"

      # The coverage thresholds in vitest.config.ts apply to these two projects. Memory policy
      # (pool, workers, heap) lives in vitest.config.ts; no NODE_OPTIONS here.
      - name: Run the unit and integration projects with coverage
        run: pnpm exec vitest run --project unit --project integration --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-${{ matrix.id }}
          path: coverage
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Oracle and adversarial tests, fixture checks, corpus and ledger gates
  # ---------------------------------------------------------------------------
  # Gating Node line only. The oracle project judges the library's output with tools outside it
  # (qpdf, installed below, and the pdfjs-dist devDependency); its packaging snapshot test needs
  # dist/ and dist/wasm/ (the build-ts artifact) and the history back to the previous release
  # (its tag or the commit that set its version), hence the full clone. Every step after the adversarial run has `if: !cancelled()`, so one red gate does not
  # hide the next. fixtures:legacy:check does not run in this workflow: it installs the published
  # 0.40.3 package from the npm registry.
  test-oracle:
    name: Oracle and adversarial tests
    needs: build-ts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Download dist
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: wasm-modules
          path: crates

      # The oracle project, the corpus gate and the fixture checks below run qpdf; with CI set,
      # the oracle tests fail when it is missing instead of skipping. The release is pinned by the
      # SHA-256 of its x86_64 AppImage (taken from the release's qpdf-<version>.sha256 asset);
      # QPDF_VERSION and QPDF_SHA256 move together, and the qpdf generators in scripts/fixtures/ refuse
      # any other qpdf version. The AppImage is extracted, so no FUSE is needed.
      - name: Install qpdf
        env:
          GH_TOKEN: ${{ github.token }}
          QPDF_VERSION: 12.4.2
          QPDF_SHA256: 907b5e86f289c92b382a02869eb9c5709b2e5ef6fb2f6a7ae56514915d06d5dd
        run: |
          mkdir -p "$RUNNER_TEMP/qpdf" && cd "$RUNNER_TEMP/qpdf"
          appimage="qpdf-$QPDF_VERSION-x86_64.AppImage"
          gh release download "v$QPDF_VERSION" -R qpdf/qpdf -p "$appimage"
          echo "$QPDF_SHA256  $appimage" | sha256sum -c -
          chmod +x "$appimage"
          "./$appimage" --appimage-extract > /dev/null
          echo "QPDF=$RUNNER_TEMP/qpdf/squashfs-root/AppRun" >> "$GITHUB_ENV"

      # The time budgets of tests/helpers/budget.ts are calibrated on a developer machine; a hosted
      # runner is several times slower and varies from run to run, so the runner's time limit is
      # multiplied by 4 here. The memory budget is never scaled.
      - name: Run the adversarial project
        env:
          MPL_BUDGET_TIME_SCALE: 4
        run: pnpm exec vitest run --project adversarial

      # The JSON report feeds the marker list and the capability gate below.
      - name: Run the oracle project (JSON report)
        if: ${{ !cancelled() }}
        run: >-
          pnpm exec vitest run --project oracle --reporter=default --reporter=json
          --outputFile="$RUNNER_TEMP/vitest-oracle.json"

      # One line per known-defect marker with its status in the report; fails on a marker that
      # did not fail for its stated reason. The list is uploaded as the marker baseline.
      - name: Known-defect markers of the oracle run
        if: ${{ !cancelled() }}
        shell: bash
        run: node scripts/dev/known-defects.ts --list "$RUNNER_TEMP/vitest-oracle.json" | tee "$RUNNER_TEMP/known-defects.tsv"

      - name: Encrypted fixtures equal a fresh qpdf run
        if: ${{ !cancelled() }}
        run: node scripts/fixtures/encrypted-fixtures.ts --check

      - name: qpdf accepts every PDF 2.0 password hash case
        if: ${{ !cancelled() }}
        run: node scripts/fixtures/pdf20-hash-cases.ts --check

      # corpus.ts --check runs tests/oracle/corpus.test.ts again (retry 0, its own JSON report) to
      # build the per-file summary, so that file runs twice in this job: in the oracle project
      # above and here.
      - name: Corpus gate (manifest, contact-data scan, corpus tests)
        if: ${{ !cancelled() }}
        run: node scripts/dev/corpus.ts --check --summary "$RUNNER_TEMP/corpus-summary.json"

      - name: Findings ledger and markers (surface gate)
        if: ${{ !cancelled() }}
        run: node scripts/dev/surface-gate.ts

      # Report-only in this release: a pending row or a row without passing evidence in the
      # report is printed, and the job does not fail on it.
      - name: Capability gate (report-only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node scripts/dev/capability-gate.ts --report "$RUNNER_TEMP/vitest-oracle.json"

      - name: Upload the oracle report and the marker list
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: oracle-report
          path: |
            ${{ runner.temp }}/vitest-oracle.json
            ${{ runner.temp }}/known-defects.tsv
          retention-days: 30

      - name: Upload the corpus summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: corpus-summary
          path: ${{ runner.temp }}/corpus-summary.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # E2E tests (Playwright)
  # ---------------------------------------------------------------------------
  test-e2e:
    name: E2E Tests
    needs: build-ts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Download dist
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: wasm-modules
          path: crates

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Benchmarks
  # ---------------------------------------------------------------------------
  benchmark:
    name: Benchmarks
    needs: build-ts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: always()
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Download dist
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: wasm-modules
          path: crates

      - name: Run benchmarks (standalone tinybench harness, tests/benchmarks/run.ts)
        run: pnpm run bench

  # ---------------------------------------------------------------------------
  # Bundle size (size gate)
  # ---------------------------------------------------------------------------
  # Job id and name are kept so a required status check that names them still matches.
  # scripts/dev/size-gate.ts bundles the built package (the build-ts dist artifact) with the
  # installed esbuild: the createPdf, loadPdf, root, per-entry and IIFE bundles, gzip and
  # brotli, each against its ratchet budget in scripts/dev/size-budget.json, and checks the
  # README bundle badge. The table goes to the job summary, the verdict to the log.
  bundle-size:
    name: Bundle Size
    needs: build-ts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Download dist
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Size gate
        run: node scripts/dev/size-gate.ts >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Rust checks (per crate)
  # ---------------------------------------------------------------------------
  # For each of the six crates under crates/: `cargo clippy --target wasm32-unknown-unknown`
  # and the native `cargo test`. `continue-on-error` keeps the job from failing the workflow;
  # it reports clippy and test results per crate.
  rust-checks:
    name: Rust (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        crate: [libdeflate, png, ttf, shaping, jbig2, jpeg]
    defaults:
      run:
        working-directory: crates/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/${{ matrix.crate }} -> target

      - name: Clippy (wasm32-unknown-unknown)
        run: cargo clippy --target wasm32-unknown-unknown

      - name: Native tests
        run: cargo test
