name: Release

on:
  push:
    tags:
      - 'v*'

# Jobs elevate individually (publish: id-token; github-release: contents).
permissions:
  contents: read

env:
  # Must equal `channel` in rust-toolchain.toml; bump both together. A dated
  # toolchain input needs a commit of the dtolnay/rust-toolchain master branch (see .peak-modern-holds.json).
  RUST_TOOLCHAIN: nightly-2026-11-15

jobs:
  # ---------------------------------------------------------------------------
  # Full build (WASM + TypeScript) and the one tarball that gets published
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The tarball takes its version from package.json, the release from the tag.
      - name: Require the tag to match the package.json version
        run: |
          version="$(jq -r .version package.json)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      # Each crate is its own Cargo root until the workspace migration.
      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            crates/libdeflate -> target
            crates/png -> target
            crates/ttf -> target
            crates/shaping -> target
            crates/jbig2 -> target
            crates/jpeg -> target

      # build-wasm.sh downloads the binaryen release named by its BINARYEN_VERSION
      # into .cache/binaryen and verifies its SHA-256; the key reads that variable.
      - name: Read binaryen version
        id: binaryen
        run: echo "version=$(sed -n 's/^BINARYEN_VERSION=//p' scripts/build/build-wasm.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache binaryen
        uses: actions/cache@v6.1.0
        with:
          path: .cache/binaryen
          key: binaryen-${{ runner.os }}-${{ steps.binaryen.outputs.version }}

      # wasm-pack is a pinned devDependency, installed by this step.
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Build WASM crates
        run: pnpm run build:wasm

      - name: Verify WASM binaries
        run: |
          for crate in libdeflate png ttf shaping jbig2 jpeg; do
            if ! ls crates/${crate}/pkg/*.wasm 1>/dev/null 2>&1; then
              echo "::error::WASM binary missing for crate: ${crate}"
              exit 1
            fi
          done
          echo "All WASM binaries verified."

      # `pnpm run build` is tsdown + IIFE bundle + the ESM/CJS smoke of every BUILT
      # dist entry. The smoke is the check that guards the published artifact (it
      # catches the v0.28.0-class "unimportable package" bug that the unit suite,
      # running on src/, cannot). The full unit/integration suite is gated by ci.yml
      # on this exact commit (a tag is cut from a master commit that ci.yml tests),
      # so re-running the whole suite here is redundant. Tests live in ci.yml; this
      # job builds, smokes, packs and inspects.
      - name: Build TypeScript (tsdown, IIFE, smoke)
        run: pnpm run build

      - name: Copy WASM binaries into dist/wasm
        run: pnpm run copy:wasm

      - name: Pack the npm tarball
        run: pnpm pack --pack-destination pack

      # Inspect the exact file the publish job will upload: six wasm + IIFE listed,
      # publint, are-the-types-wrong.
      - name: Inspect the tarball
        run: |
          tarballs=(pack/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
            echo "::error::Expected exactly one tarball in pack/, found: ${tarballs[*]}"
            exit 1
          fi
          pnpm run check:pack "./${tarballs[0]}"

      - name: Upload npm tarball
        uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-tarball
          path: pack/*.tgz
          if-no-files-found: error

      - name: Upload WASM modules
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wasm-modules
          path: crates/*/pkg

  # ---------------------------------------------------------------------------
  # Require CI (full test + coverage suite) to be green on THIS commit before
  # publishing. The release build job runs only build + smoke + pack, so this
  # fail-closed gate enforces the invariant that the unit/integration suite passed —
  # a tag is cut from a master commit that ci.yml tests, so we wait for that run to conclude success.
  # ---------------------------------------------------------------------------
  require-ci:
    name: Require CI green on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
    steps:
      - name: Assert ci.yml succeeded on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          echo "Waiting for ci.yml to conclude on $SHA ..."
          for i in $(seq 1 180); do
            run=$(gh api "/repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1" \
              --jq 'if (.workflow_runs | length) > 0 then "\(.workflow_runs[0].status) \(.workflow_runs[0].conclusion)" else "none none" end' \
              2>/dev/null || echo "none none")
            status=$(echo "$run" | awk '{print $1}')
            conclusion=$(echo "$run" | awk '{print $2}')
            echo "  attempt $i: status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "ci.yml succeeded on $SHA — proceeding."
                exit 0
              fi
              echo "::error::ci.yml concluded '$conclusion' on $SHA — refusing to publish."
              exit 1
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for ci.yml on $SHA — refusing to publish."
          exit 1

  # ---------------------------------------------------------------------------
  # Publish to npm: the tarball the build job inspected, with no rebuild
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to npm
    needs: [build, require-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      # The checkout supplies package.json so pnpm/setup can resolve the pinned pnpm.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          install: false

      - name: Download npm tarball
        uses: actions/download-artifact@v8.0.2
        with:
          name: npm-tarball
          path: pack

      # npm trusted publishing (OIDC): no token. --provenance makes the step fail
      # when no provenance attestation can be made. A tag checkout is a detached
      # HEAD, so the git checks are skipped.
      - name: Publish the inspected tarball
        run: |
          tarballs=(pack/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
            echo "::error::Expected exactly one tarball in pack/, found: ${tarballs[*]}"
            exit 1
          fi
          pnpm publish "./${tarballs[0]}" --access public --provenance --no-git-checks

  # ---------------------------------------------------------------------------
  # GitHub Release with the npm tarball and WASM binaries
  # ---------------------------------------------------------------------------
  github-release:
    name: GitHub Release
    # After publish: a GitHub release never announces a version that is not on npm.
    needs: [build, require-ci, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download npm tarball
        uses: actions/download-artifact@v8.0.2
        with:
          name: npm-tarball
          path: pack

      - name: Download WASM modules
        uses: actions/download-artifact@v8.0.2
        with:
          name: wasm-modules
          path: wasm-artifacts

      - name: Package WASM binaries
        run: |
          cd wasm-artifacts
          for dir in */pkg; do
            crate=$(dirname "$dir")
            tar -czf "../modern-pdf-wasm-${crate}.tar.gz" -C "$dir" .
          done
          cd ..

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section for this version from CHANGELOG.md
          BODY=$(sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d' || echo "Release ${GITHUB_REF_NAME}")
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: |
            pack/*.tgz
            modern-pdf-wasm-*.tar.gz
          generate_release_notes: true
          # Mark each new release as Latest. `legacy` would let GitHub pick by commit date, which
          # can leave an older release marked Latest. A re-run for an older tag marks that older
          # release Latest too, so after re-running an old tag, restore the mark with
          # `gh release edit <newest tag> --latest`.
          make_latest: true

# Docs are deployed by the dedicated docs.yml workflow on every push to master
# (decoupled from version tags), so there is no docs job here.
