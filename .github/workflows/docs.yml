name: Docs

# Deploy the documentation site on every push to master (decoupled from the
# Release workflow, which only fires on version tags). Also runnable manually.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Serialize Pages deployments: a running deploy finishes, and the newest waiting push goes next.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # pnpm from `packageManager`; one frozen workspace install also covers
      # tools/docs (the isolated TypeScript 6 typedoc sidecar).
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Generate API docs (typedoc + VitePress sanitizer)
        run: pnpm run docs:api

      - name: Build VitePress site
        run: pnpm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy-docs:
    name: Deploy Docs
    needs: build-docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
