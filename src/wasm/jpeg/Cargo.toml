[package]
name = "modern-pdf-jpeg"
version = "0.1.0"
edition = "2024"
description = "WASM-compiled JPEG encoder/decoder for the modern-pdf library"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.130"
jpeg-encoder = "=0.7.1"
jpeg-decoder = { version = "=0.3.2", default-features = false }

[package.metadata.wasm-pack.profile.release]
# wasm-pack skips wasm-opt (its bundled binaryen is version_130); scripts/build-wasm.sh
# runs the pinned newest binaryen on pkg/*_bg.wasm instead.
wasm-opt = false

[profile.release]
# Optimize for small binary size -- critical for WASM delivery
opt-level = "z"
lto = true
codegen-units = 1
# Keep the target_features section (wasm-bindgen warns against strip = true).
strip = "debuginfo"
panic = "abort"
